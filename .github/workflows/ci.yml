name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Which platforms to test on, decided per event.
  #
  # The full matrix on every pull request exhausted the account's Actions
  # allowance in a day: macOS bills at ten times Linux, so 100 minutes of
  # macOS consumed half the monthly quota and every job then failed instantly
  # with no steps, which reads exactly like a broken workflow file.
  #
  # Ordinary pull requests get Linux. Pushes to main and release-labelled
  # pull requests get all three, because that is where the platform-specific
  # failures matter - the bind-mount symlink bypass was caught only by macOS.
  platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] ||              [ "${{ contains(github.event.pull_request.labels.*.name, 'release') }}" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
            echo "full matrix"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "linux only"
          fi

  # ── Rust library crates (all 3 platforms) ──────────────────────────────────
  check:
    name: Check / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.os }}
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo check --workspace

  test:
    name: Test / ${{ matrix.os }}
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.os) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      # Tests that need a display (Tauri) are skipped in headless CI via cfg
      # Tee the output and republish failures into the job summary.
      #
      # Job logs need admin rights to download, so a contributor without them
      # sees only "exit code 101" on a failing platform and has to guess which
      # test broke. Step summaries are readable by anyone who can see the
      # check, so the failing test names travel with the result.
      - name: cargo test --workspace
        env:
          # Link fewer binaries at once.
          #
          # ld died with "signal 7 [Bus error], core dumped" on ubuntu while
          # macOS and Windows passed: the workspace produces a lot of large
          # test binaries, and linking them in parallel exhausts the runner's
          # memory. This is a machine limit, not a code fault, so the fix is
          # to stop asking for more memory than the runner has rather than to
          # weaken the tests.
          # ld died with 'signal 7 [Bus error]' and the same log warned
          # 'You are running out of disk space': it was writing object
          # files to a full runner disk, not running out of memory.
          # Debug info dominates test binary size and nothing reads a CI
          # backtrace, so dropping it reclaims more than we were short of.
          CARGO_BUILD_JOBS: 2
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
        shell: bash

      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          {
            echo "### Failing tests on ${{ matrix.os }}"
            echo
            echo '```'
            # The names under "failures:" plus any panic lines, which together
            # identify the test and say why without needing the full log.
            awk '/^failures:$/{f=1;next} /^test result:/{f=0} f' test-output.txt | sort -u
            grep -E "panicked at|assertion .* failed|left:|right:" test-output.txt | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Gate every workspace crate on rustfmt to keep `cargo fmt --all --check` clean.
      # See issue #1121.
      - run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - run: cargo audit

  # ── Secrets scanning (prevent accidental credential commits) ──────────────
  secrets:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install TruffleHog v3.95.9
        run: |
          curl -sSfL -o /tmp/trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.9/trufflehog_3.95.9_linux_amd64.tar.gz
          echo "f6d1106b85107d79527ed7a5b98b592beadd8b770dc3c9e8c1ad99e1b2cf127e  /tmp/trufflehog.tar.gz" | sha256sum --check
          tar -xzf /tmp/trufflehog.tar.gz -C /usr/local/bin trufflehog
      - name: Scan for secrets
        run: |
          # The Lob detector is excluded because it matches Rust test
          # function names -- test_derive_session_key_different_nonces,
          # test_image_gen_request_validate_bad_size and 39 others -- and
          # then reports them as *verified* secrets. Verification calls the
          # provider API, and Lob answers non-deterministically, so the
          # identical tree passed once on main and failed the four runs
          # before it. A gate that blocks merges at random teaches people
          # to ignore it, which is worse than not having one.
          #
          # This drops one provably wrong detector, not the scan: every
          # other detector still runs with --only-verified --fail. Revisit
          # if this project ever actually uses Lob.
          trufflehog filesystem . \
            --no-update \
            --fail \
            --only-verified \
            --exclude-detectors=lob \
            --exclude-paths=<(echo -e "target/\n.git/\nCargo.lock")

  # ── Installer smoke test (verify install scripts from Vercel) ──────────────
  install-smoke:
    name: Install Script Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and syntax-check shell installer
        run: |
          bash -n scripts/install.sh
      - name: Fetch and syntax-check PowerShell installer
        run: |
          pwsh -NoProfile -Command "Get-Content scripts/install.ps1 | Out-Null"
