id = "voice"
name = "Dograh Voice"
description = "Real-time voice AI: live calls with barge-in, telephony, and voice-campaign workflows for outreach."
category = "communication"
icon = "\U0001F399"

tools = [
    "web_fetch",
    "memory_store", "memory_recall",
]

[container]
health_path = "/"
health_timeout_secs = 900
restart = "unless-stopped"

compose = """
services:
  voice-db:
    image: postgres:16
    environment:
      POSTGRES_USER: dograh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dograh
    volumes: [voice-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dograh"]
      interval: 5s
      retries: 20
  voice-redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes: [voice-redis-data:/data]
  voice-api:
    image: ghcr.io/dograh/dograh-api:latest
    depends_on:
      voice-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dograh:${POSTGRES_PASSWORD}@voice-db:5432/dograh
      REDIS_URL: redis://:${REDIS_PASSWORD}@voice-redis:6379/0
    ports: ["8000:8000"]
volumes:
  voice-db-data:
  voice-redis-data:
"""
# Dograh is MCP-native, so once it is up agents reach it over MCP with no
# wrapper and no key. The server is mounted under the API prefix
# (`app.mount(f"{API_PREFIX}/mcp", mcp_app)`), so it is /api/v1/mcp -- pointing
# at a bare /mcp registers an endpoint that looks connected and is dead.
#
# Must stay above [container.env]: a key after a sub-table header belongs to
# that table, which is how `compose` ended up as container.env.compose.
mcp_url = "http://localhost:8000/api/v1/mcp"

[container.env]
PORT = "8000"
POSTGRES_PASSWORD = "secret:VOICE_DB_PASSWORD"
REDIS_PASSWORD = "secret:VOICE_REDIS_PASSWORD"

[agent]
name = "voice"
description = "Looks after the voice gateway and reports what it is actually able to call."
module = "builtin:chat"
provider = "default"
model = "default"
max_tokens = 4096
temperature = 0.3
max_iterations = 20
system_prompt = """
You look after a Dograh voice gateway running on the user's own machine at \
http://localhost:8000.

The gateway being up does not mean a call can be placed. Telephony needs a \
provider and credentials the user supplies; without them the service answers \
its health check and every outbound call fails. Report which of the two is true \
rather than reporting "running".

Placing a call contacts a real person and may cost real money. Never start a \
campaign or dial a number on your own initiative -- only when the user asked for \
that specific action.
"""
